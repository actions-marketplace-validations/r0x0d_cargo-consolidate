[package]
name = "cargo-consolidate"
edition = "2021"
version = "0.1.0"
description = "Identify shared workspace dependencies and version mismatches"
keywords = ["cargo", "workspace", "dependencies", "lint", "analysis"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/r0x0d/cargo-consolidate"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
glob = "0.3"
owo-colors = "4"
semver = "1"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
